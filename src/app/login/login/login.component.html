<div class="login">
  <div class="logo">FINDMATCH</div>
  <div class="login-wrapper">
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <input type="email" formControlName="email" placeholder="Dirección de correo" />

      <div class="password-wrapper">
        <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Contraseña" />
        <button type="button" class="toggle-password" (click)="togglePassword()">Mostrar</button>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" class="submit-btn" [disabled]="loginForm.invalid">INICIAR SESIÓN</button>
      <button type="button" class="register-btn" routerLink="/selectRegister">REGISTRARSE</button>
    </form>

    <div class="footer">
       <a href="termsOfService">Términos de uso</a> · <a href="privacyPolicy">Política de Privacidad</a>
    </div>
  </div>
</div>
